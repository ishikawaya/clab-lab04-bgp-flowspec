[global.config]
  as = 64530
  router-id = "3.3.3.3"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "1.1.1.1"
    peer-as = 64520

  [neighbors.transport.config]
    passive-mode = false
    local-address = "3.3.3.3"  # ← 追加: 送信元IPをLoopbackに固定

  [neighbors.ebgp-multihop.config]
    enabled = true
    multihop-ttl = 16

  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-flowspec"
