frr version 10.8.0-dev_git20260806
frr defaults traditional
hostname as64530
log stdout informational
log file /var/log/frr.log
service integrated-vtysh-config
!
ip route 2.0.0.0/8 Null0 254
ip route 3.0.0.0/8 Null0 254
ip route 3.3.3.3/32 2.0.0.3 eth3
!
interface eth1
 description user02:eth1
 ip address 2.0.0.0/31
exit
!
interface eth2
 description as64520:eth2
 ip address 3.0.0.0/31
exit
!
interface eth3
 description gobgp01:eth1
 ip address 2.0.0.2/31
exit
!
interface lo
 ip address 2.2.2.2/32
exit
!
router bgp 64530
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 3.0.0.1 remote-as 64520
 neighbor 3.0.0.1 description as64520
 !
 address-family ipv4 unicast
  network 2.0.0.0/8
  network 3.0.0.0/8
  neighbor 3.0.0.1 activate
 exit-address-family
exit
!
